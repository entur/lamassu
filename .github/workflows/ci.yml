name: CI Build

on:
  push:
    branches-ignore:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build and publish Docker image'
        type: boolean
        default: true
      ref:
        description: 'Git ref to checkout (branch, tag, or commit SHA)'
        type: string
        default: 'master'
        required: true

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # nodejs is needed because the dynamic download of it via the prettier maven plugin often
      # times out
      # Example: https://github.com/opentripplanner/OpenTripPlanner/actions/runs/4490450225/jobs/7897533439
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Same JDK as the distroless runtime image (Temurin). check-latest skips the runner's
      # cached JDK, which can lag behind.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          check-latest: true
          distribution: temurin
          cache: maven

      - name: Run tests
        run: |
          sudo timedatectl set-timezone "Europe/Oslo"
          mvn --batch-mode jacoco:prepare-agent test jacoco:report -Dprettier.nodePath=node -Dprettier.npmPath=npm
          mvn --batch-mode jib:dockerBuild -Djib.to.image=lamassu:smoke -Dmaven.test.skip -P prettierSkip

      # Nothing else in CI runs the image. Reaching Spring's banner proves the JRE loaded the
      # application bytecode; it then fails without Redis, which is fine. The banner, not the
      # "using Java" line, because the root log level hides INFO.
      - name: Smoke test image
        run: |
          timeout 180 docker run --rm lamassu:smoke 2>&1 | tee smoke.log || true
          grep -q ":: Spring Boot ::" smoke.log

      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./target/site/jacoco/jacoco.xml

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check UI
        run: |
          npm install
          npm run check
          npm run build

  image:
    # Build and push the image when:
    # 1. It's a direct push to the repository (excluding PRs), or
    # 2. It's triggered by workflow_dispatch (either from post-merge workflow or manually)
    #    and build_image is true or not specified
    if: github.repository_owner == 'entur' && github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_image == 'true' || github.event.inputs.build_image == '')))
    runs-on: ubuntu-latest
    needs: [ tests, ui ]
    env:
      CONTAINER_REPO: docker.io/entur/lamassu
      CONTAINER_REGISTRY_USER: ${{ secrets.DOCKERHUB_LOGIN }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # Same JDK as the distroless runtime image (Temurin). check-latest skips the runner's
      # cached JDK, which can lag behind.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          check-latest: true
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: set variables
        run: |
          echo "GHA_DOCKER_PUSH_IMAGE_TAG=`date +%Y-%m-%dT%H-%M`" >> $GITHUB_ENV

      - name: Build UI
        run: npm install --prefix ui && npm run build --prefix ui

      - name: Build container image with Jib, push to container repo
        run: |
          mvn --batch-mode compile \
            com.google.cloud.tools:jib-maven-plugin:build \
            -Djib.to.tags=latest,${{ env.GHA_DOCKER_PUSH_IMAGE_TAG }} \
            -Dmaven.test.skip \
            -P prettierSkip

      - name: Tag default branch with the container image tag ${{ env.GHA_DOCKER_PUSH_IMAGE_TAG }}
        id: tag-version
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$GHA_DOCKER_PUSH_IMAGE_TAG" -m "chore(tag): $GHA_DOCKER_PUSH_IMAGE_TAG [skip ci]" --force
          git push origin "$GHA_DOCKER_PUSH_IMAGE_TAG" --force

      - name: Trigger downstream CI
        run: |
          repo_owner="entur"
          repo_name="lamassu-deployment-config"
          event_type="trigger-downstream-ci"
          service="lamassu"   
          echo "Triggering downstream CI for $service with version $GHA_DOCKER_PUSH_IMAGE_TAG"
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITFLOW_PAT }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Content-Type: application/json" https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
          -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"service\": \"$service\", \"version\": \"$GHA_DOCKER_PUSH_IMAGE_TAG\", \"unit\": false, \"integration\": true}}"
