name: CI Build

on:
  push:
    branches-ignore:
      - master
      # Dependabot PRs get the pull_request run
      - dependabot/**
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_image:
        description: 'Build and publish Docker image'
        type: boolean
        default: true
      ref:
        description: 'Git ref to checkout (branch, tag, or commit SHA)'
        type: string
        default: 'master'
        required: true

jobs:
  # Resolve the ref once, so every job builds the same commit even if the branch moves
  commit:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: commit
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}

      # nodejs is needed because the dynamic download of it via the prettier maven plugin often
      # times out
      # Example: https://github.com/opentripplanner/OpenTripPlanner/actions/runs/4490450225/jobs/7897533439
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Same JDK as the distroless runtime image (Temurin). check-latest skips the runner's
      # cached JDK, which can lag behind.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          check-latest: true
          distribution: temurin
          cache: maven

      - name: Run tests
        run: |
          sudo timedatectl set-timezone "Europe/Oslo"
          mvn --batch-mode jacoco:prepare-agent test jacoco:report -Dprettier.nodePath=node -Dprettier.npmPath=npm

      - name: Build jar
        run: mvn --batch-mode package -Dmaven.test.skip -P prettierSkip

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image job's build, minus the push, so a broken Docker action bump fails before merge
      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      - name: Load container image for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: lamassu:smoke

      # Nothing else in CI runs the image. Reaching Spring's banner proves the JRE loaded the
      # application bytecode; it then fails without Redis, which is fine. The banner, not the
      # "using Java" line, because the root log level hides INFO.
      - name: Smoke test image
        run: |
          timeout 180 docker run --rm lamassu:smoke 2>&1 | tee smoke.log || true
          grep -q ":: Spring Boot ::" smoke.log

      - name: codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./target/site/jacoco/jacoco.xml

  ui:
    needs: commit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check UI
        run: |
          npm install
          npm run check
          npm run build

  docker-lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  image:
    # Build and push the image when:
    # 1. It's a direct push to the repository (excluding PRs), or
    # 2. It's triggered by workflow_dispatch (either from post-merge workflow or manually)
    #    and build_image is true or not specified
    if: github.repository_owner == 'entur' && github.event_name != 'pull_request' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_image == 'true' || github.event.inputs.build_image == '')))
    runs-on: ubuntu-latest
    needs: [ commit, tests, ui, docker-lint ]
    # One release at a time, so an older build can't overwrite latest or the dev deploy
    concurrency:
      group: ${{ github.workflow }}-image
      cancel-in-progress: false
    env:
      CONTAINER_REPO: docker.io/entur/lamassu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.commit.outputs.sha }}
          fetch-depth: 0

      # Runs can finish out of order: don't publish a commit older than the last release
      - name: Check for a newer release
        id: release
        run: |
          last=$(git tag --list '20*' --sort=-refname | head -1)
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" != "$(git rev-parse HEAD)" ] \
            && git merge-base --is-ancestor HEAD "$last"; then
            echo "::notice::$last already released a newer commit, skipping"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Same JDK as the distroless runtime image (Temurin). check-latest skips the runner's
      # cached JDK, which can lag behind.
      - name: Set up JDK 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: 25
          check-latest: true
          distribution: temurin
          cache: maven

      - name: set variables
        run: |
          echo "GHA_DOCKER_PUSH_IMAGE_TAG=$(date +%Y-%m-%dT%H-%M-%S)" >> "$GITHUB_ENV"

      # Also builds the UI (frontend-maven-plugin)
      - name: Build jar
        run: mvn --batch-mode package -Dmaven.test.skip -P prettierSkip

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build container image, push to container repo
        if: steps.release.outputs.stale != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.CONTAINER_REPO }}:latest
            ${{ env.CONTAINER_REPO }}:${{ env.GHA_DOCKER_PUSH_IMAGE_TAG }}

      - name: Tag default branch with the container image tag ${{ env.GHA_DOCKER_PUSH_IMAGE_TAG }}
        if: steps.release.outputs.stale != 'true'
        id: tag-version
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$GHA_DOCKER_PUSH_IMAGE_TAG" -m "chore(tag): $GHA_DOCKER_PUSH_IMAGE_TAG [skip ci]" --force
          git push origin "$GHA_DOCKER_PUSH_IMAGE_TAG" --force

      - name: Trigger downstream CI
        if: steps.release.outputs.stale != 'true'
        run: |
          repo_owner="entur"
          repo_name="lamassu-deployment-config"
          event_type="trigger-downstream-ci"
          service="lamassu"   
          echo "Triggering downstream CI for $service with version $GHA_DOCKER_PUSH_IMAGE_TAG"
          curl -X POST \
          -H "Authorization: token ${{ secrets.GITFLOW_PAT }}" \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Content-Type: application/json" https://api.github.com/repos/$repo_owner/$repo_name/dispatches \
          -d "{\"event_type\": \"$event_type\", \"client_payload\": {\"service\": \"$service\", \"version\": \"$GHA_DOCKER_PUSH_IMAGE_TAG\", \"unit\": false, \"integration\": true}}"
